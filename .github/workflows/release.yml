name: Release

# Работа идёт в develop: на каждый push собирается раздел CHANGELOG.md и черновик релиза v<версия из manifest.json>.
# Если эта версия уже выпущена, а расширение с неё менялось, бот сам поднимает версию (patch / minor / major по коммитам).
# Принят pull request develop → main — черновик публикуется, тег ставится на merge-коммит в main.
# Нужно разрешение «Read and write permissions» (Settings → Actions → General → Workflow permissions).
on:
  push:
    branches: [develop]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    name: Build release draft
    if: github.ref_name == 'develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: develop
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # вся история и теги: раздел собирается с последнего тега-релиза
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Bump version if needed, prepend CHANGELOG.md and sync release draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/changelog-prepend.js --draft --bump

      - name: Commit version and CHANGELOG.md if changed
        run: |
          FILES="CHANGELOG.md manifest.json package.json package-lock.json"
          if git diff --quiet -- $FILES && [ -z "$(git ls-files --others --exclude-standard -- CHANGELOG.md)" ]; then
            echo "Версия и CHANGELOG.md не изменились."
            exit 0
          fi
          # Без [skip ci]: коммит бота часто последний в pull request develop → main, а с этой меткой
          # GitHub не запускает и job publish после merge. Зацикливания нет: push с GITHUB_TOKEN не запускает workflow.
          MESSAGE="Обновить CHANGELOG.md"
          if ! git diff --quiet -- manifest.json; then
            VERSION=$(node -p "require('./manifest.json').version")
            MESSAGE="Поднять версию до $VERSION и обновить CHANGELOG.md"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "$MESSAGE"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

  publish:
    name: Publish release
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Падает, если версию в manifest.json не подняли, а в main пришли правки расширения.
      # Пришли только тесты, CI или документация — завершается без релиза.
      - name: Publish release draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: node scripts/changelog-prepend.js --publish
